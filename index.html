<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Live HTML, CSS and JavaScript playground in the browser." />
  <title>Code Editor</title>
  <!-- Link to external CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="con">
    <div class="left">
      <div class="content">
        <label for="html">HTML</label>
        <textarea id="html" spellcheck="false" placeholder="Write HTML code here..."></textarea>
        <button class="copy-btn" data-target="html">Copy HTML</button>
      </div>
      <div class="content">
        <label for="css">CSS</label>
        <textarea id="css" spellcheck="false" placeholder="Write CSS code here..."></textarea>
        <button class="copy-btn" data-target="css">Copy CSS</button>
      </div>
      <div class="content">
        <label for="js">JavaScript</label>
        <textarea id="js" spellcheck="false" placeholder="Write JavaScript code here..."></textarea>
        <button class="copy-btn" data-target="js">Copy JavaScript</button>
      </div>
    </div>
    <div class="right">
      <label>Output</label>
      <iframe id="output" title="Live output" sandbox="allow-scripts allow-modals"></iframe>
    </div>
  </div>

  <!-- Link to external JavaScript -->
  <script src="script.js"></script>
</body>

</html>
